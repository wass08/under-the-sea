    <style>

      #app { opacity:0; transition:opacity 1.8s ease; }
      html.revealing #app { opacity:1; }
      .masthead, .caption, .dock, .fishing-hud, .panel { transition:opacity .9s ease, translate .9s cubic-bezier(.2,.8,.2,1); }

      html.revealed .caption { transition-delay:.85s; } html.revealed .panel { transition-delay:1.05s; }
      #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:5; color:#8fa6ba; font:500 11px/1.4 'DM Sans',system-ui,sans-serif; letter-spacing:.06em; pointer-events:none; transition:opacity .9s ease; }
      html.revealing #loading { opacity:0; }
      #loading[hidden] { display:none; }
      #loading.error { inset:auto; top:50%; left:50%; transform:translate(-50%,-50%); max-width:90vw; padding:22px 28px; background:#0a1a2bea; border:1px solid #9fe6ff33; border-radius:12px; color:#e6eef5; font-size:13px; letter-spacing:0; text-align:center; pointer-events:auto; }
      .loader-fish { width:58px; height:36px; color:#cfe0ee; overflow:visible; animation:loader-swim 2.4s ease-in-out infinite; }
      .loader-fish .tail { transform-origin:16px 18px; animation:loader-tail .45s ease-in-out infinite alternate; }
      .loader-fish .bubble { animation:loader-bubble 2.4s ease-in infinite; opacity:0; }
      .loader-fish .bubble.b2 { animation-delay:.8s; } .loader-fish .bubble.b3 { animation-delay:1.6s; }
      @keyframes loader-swim { 0%,100% { transform:translate(-6px,0) rotate(-3deg); } 50% { transform:translate(6px,-4px) rotate(3deg); } }
      @keyframes loader-tail { from { transform:rotate(-14deg); } to { transform:rotate(14deg); } }
      @keyframes loader-bubble { 0% { opacity:0; transform:translate(0,0); } 20% { opacity:.8; } 100% { opacity:0; transform:translate(4px,-22px); } }
      @media (prefers-reduced-motion:reduce) { .loader-fish, .loader-fish .tail, .loader-fish .bubble { animation:none; } }
